<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — SmartMeal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <div class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb" class="mb-2">
        <ol class="breadcrumb" style="font-size:0.8rem;">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active">Menu</li>
        </ol>
      </nav>
      <h1>Our Full Menu</h1>
      <p style="opacity:0.7;font-size:0.95rem;margin-top:6px;">Fresh, healthy meals for every lifestyle. <span id="itemCount" style="color:var(--accent);font-weight:600;"></span></p>
    </div>
  </div>

  <!-- Menu Section -->
  <section class="menu-section">
    <div class="container">
      <!-- Filters Bar -->
      <div class="filters-bar">
        <div class="search-wrap">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="searchInput" class="filter-search" placeholder="Search meals, ingredients...">
        </div>
        <select id="categoryFilter" class="filter-select">
          <option value="all">All Categories</option>
          <option value="Vegan">🥗 Vegan</option>
          <option value="High Protein">💪 High Protein</option>
          <option value="Keto">🥑 Keto</option>
          <option value="Healthy">❤️ Healthy</option>
          <option value="Low Calorie">🔥 Low Calorie</option>
        </select>
        <select id="sortFilter" class="filter-select">
          <option value="default">Sort: Default</option>
          <option value="price_asc">Price: Low → High</option>
          <option value="price_desc">Price: High → Low</option>
          <option value="rating">Top Rated</option>
          <option value="calories_asc">Lowest Calories</option>
        </select>
        <button class="filter-btn" onclick="resetFilters()">
          <i class="fas fa-rotate-left"></i> Reset
        </button>
      </div>

      <!-- Category Chips -->
      <div class="d-flex flex-wrap gap-2 mb-4" id="catChips">
        <span class="category-pill active" data-cat="all" onclick="setCatChip(this, 'all')" style="cursor:pointer;">🍽️ All</span>
        <span class="category-pill" data-cat="Vegan" onclick="setCatChip(this, 'Vegan')" style="cursor:pointer;">🥗 Vegan</span>
        <span class="category-pill" data-cat="High Protein" onclick="setCatChip(this, 'High Protein')" style="cursor:pointer;">💪 Protein</span>
        <span class="category-pill" data-cat="Keto" onclick="setCatChip(this, 'Keto')" style="cursor:pointer;">🥑 Keto</span>
        <span class="category-pill" data-cat="Healthy" onclick="setCatChip(this, 'Healthy')" style="cursor:pointer;">❤️ Healthy</span>
        <span class="category-pill" data-cat="Low Calorie" onclick="setCatChip(this, 'Low Calorie')" style="cursor:pointer;">🔥 Low Cal</span>
      </div>

      <!-- Products Grid -->
      <div class="row g-4" id="productsGrid">
        <!-- Populated by JS -->
      </div>

      <!-- No Results -->
      <div id="noResults" class="text-center py-5" style="display:none;">
        <div style="font-size:3rem;margin-bottom:16px;">🔍</div>
        <h5 style="font-weight:700;color:var(--text-dark);">No meals found</h5>
        <p style="color:var(--text-light);font-size:0.9rem;">Try different keywords or filters.</p>
        <button class="filter-btn mt-3" onclick="resetFilters()">Clear Filters</button>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button id="scrollTopBtn" title="Back to top"><i class="fas fa-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="services/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/main.js"></script>
  <script>
    let allProducts = [];
    let currentCat = 'all';

    function loadMenu() {
      allProducts = getAllProducts();
      // Check URL param for category pre-filter
      const urlCat = new URLSearchParams(window.location.search).get('cat');
      if (urlCat) {
        currentCat = urlCat;
        document.querySelectorAll('.category-pill').forEach(el => {
          el.classList.toggle('active', el.dataset.cat === urlCat);
        });
        const catSel = document.getElementById('categoryFilter');
        if (catSel) catSel.value = urlCat;
      }
      applyFilters();
    }

    function setCatChip(el, cat) {
      document.querySelectorAll('#catChips .category-pill').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentCat = cat;
      document.getElementById('categoryFilter').value = cat;
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
      const cat = document.getElementById('categoryFilter')?.value || 'all';
      const sort = document.getElementById('sortFilter')?.value || 'default';
      currentCat = cat;

      let filtered = allProducts.filter(p => {
        const matchCat = cat === 'all' || p.category === cat;
        const matchSearch = !search || p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search) || p.category.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      if (sort === 'price_asc') filtered.sort((a, b) => a.price - b.price);
      else if (sort === 'price_desc') filtered.sort((a, b) => b.price - a.price);
      else if (sort === 'rating') filtered.sort((a, b) => b.rating - a.rating);
      else if (sort === 'calories_asc') filtered.sort((a, b) => a.calories - b.calories);

      const grid = document.getElementById('productsGrid');
      const noResults = document.getElementById('noResults');
      const countEl = document.getElementById('itemCount');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
        if (countEl) countEl.textContent = '';
      } else {
        noResults.style.display = 'none';
        grid.innerHTML = filtered.map(p => buildProductCard(p)).join('');
        if (countEl) countEl.textContent = `${filtered.length} items available`;
      }
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = 'all';
      document.getElementById('sortFilter').value = 'default';
      currentCat = 'all';
      document.querySelectorAll('#catChips .category-pill').forEach(c => c.classList.toggle('active', c.dataset.cat === 'all'));
      applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadMenu();
      document.getElementById('searchInput')?.addEventListener('input', debounce(applyFilters, 280));
      document.getElementById('categoryFilter')?.addEventListener('change', () => {
        const val = document.getElementById('categoryFilter').value;
        document.querySelectorAll('#catChips .category-pill').forEach(c => c.classList.toggle('active', c.dataset.cat === val));
        currentCat = val;
        applyFilters();
      });
      document.getElementById('sortFilter')?.addEventListener('change', applyFilters);
    });
  </script>
</body>
</html>
