<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — SmartMeal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: var(--secondary); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .admin-login-card { background: white; border-radius: var(--radius-xl); padding: 44px; max-width: 400px; width: 100%; box-shadow: var(--shadow-xl); margin: 20px; }
  </style>
</head>
<body>
  <div class="admin-login-card">
    <div class="text-center mb-4">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--primary),#FF8C5A);border-radius:14px;display:flex;align-items:center;justify-content:center;color:white;font-size:1.4rem;margin:0 auto 14px;">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h4 style="font-family:var(--font-display);font-weight:700;color:var(--text-dark);margin-bottom:4px;">Admin Panel</h4>
      <p style="color:var(--text-light);font-size:0.85rem;">SmartMeal Management Console</p>
    </div>
    <form id="adminLoginForm">
      <div class="input-group-icon" style="margin-bottom:16px;">
        <i class="fas fa-envelope form-icon"></i>
        <input type="email" class="form-input" id="adminEmail" placeholder="Admin email" required>
      </div>
      <div class="input-group-icon" style="margin-bottom:20px;">
        <i class="fas fa-lock form-icon"></i>
        <input type="password" class="form-input" id="adminPassword" placeholder="Password" required>
        <button type="button" class="toggle-pass" onclick="
          const i=document.getElementById('adminPassword');
          const isT=i.type==='text'; i.type=isT?'password':'text';
          this.innerHTML='<i class=\'fas fa-eye'+(isT?'':'-slash')+'\'>'+\'</i>\';"><i class="fas fa-eye"></i></button>
      </div>
      <button type="submit" class="btn-auth">
        <i class="fas fa-sign-in-alt me-2"></i>Access Dashboard
      </button>
    </form>
    <div class="demo-creds mt-3">
      <i class="fas fa-info-circle me-1" style="color:var(--primary);"></i>
      <strong>Admin:</strong> admin@smartmeal.com / admin123
    </div>
    <div class="text-center mt-4">
      <a href="../index.html" style="color:var(--text-light);font-size:0.82rem;"><i class="fas fa-arrow-left me-1"></i>Back to Site</a>
    </div>
  </div>

  <script src="../services/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Override default auth form listener for admin
    document.addEventListener('DOMContentLoaded', () => {
      initializeAdmin();
      document.getElementById('adminLoginForm').addEventListener('submit', e => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        const users = getAllUsers();
        const admin = users.find(u => u.email === email && u.password === password && u.role === 'admin');
        if (admin) {
          localStorage.setItem('smartmeal_admin', 'true');
          showToast('Welcome, Administrator!');
          setTimeout(() => window.location.href = 'dashboard.html', 900);
        } else {
          showToast('Invalid admin credentials', 'error');
        }
      });
    });
  </script>
</body>
</html>
