<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — SmartMeal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-wrapper">

  <!-- Top Bar -->
  <header class="admin-topbar">
    <div class="admin-brand">
      <div style="width:32px;height:32px;background:linear-gradient(135deg,var(--primary),#FF8C5A);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:0.95rem;flex-shrink:0;">
        <i class="fas fa-fire-flame-curved"></i>
      </div>
      SmartMeal <span style="font-size:0.75rem;font-weight:400;color:rgba(255,255,255,0.5);margin-left:8px;">Admin Console</span>
      <div class="brand-dot ms-2"></div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span style="color:rgba(255,255,255,0.6);font-size:0.82rem;"><i class="fas fa-user-shield me-1"></i> Administrator</span>
      <a href="../index.html" style="color:rgba(255,255,255,0.5);font-size:0.8rem;"><i class="fas fa-external-link-alt me-1"></i>View Site</a>
      <button onclick="adminLogout()" style="background:rgba(239,71,111,0.15);border:1px solid rgba(239,71,111,0.3);color:#EF476F;padding:6px 14px;border-radius:99px;font-size:0.8rem;font-weight:600;cursor:pointer;transition:var(--transition);"
        onmouseover="this.style.background='rgba(239,71,111,0.25)'" onmouseout="this.style.background='rgba(239,71,111,0.15)'">
        <i class="fas fa-sign-out-alt me-1"></i> Logout
      </button>
    </div>
  </header>

  <div class="admin-body">

    <!-- Sidebar -->
    <aside class="admin-sidebar-nav">
      <div style="font-size:0.7rem;font-weight:700;color:var(--text-light);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;padding:0 4px;">Navigation</div>
      <button class="admin-nav-item active" data-section="dashboard" onclick="showAdminSection('dashboard')">
        <i class="fas fa-th-large"></i> Dashboard
      </button>
      <button class="admin-nav-item" data-section="products" onclick="showAdminSection('products')">
        <i class="fas fa-utensils"></i> Products
      </button>
      <button class="admin-nav-item" data-section="orders" onclick="showAdminSection('orders')">
        <i class="fas fa-receipt"></i> Orders
      </button>
      <button class="admin-nav-item" data-section="users" onclick="showAdminSection('users')">
        <i class="fas fa-users"></i> Users
      </button>
      <div style="height:1px;background:var(--mid-gray);margin:14px 0;"></div>
      <div style="font-size:0.7rem;font-weight:700;color:var(--text-light);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;padding:0 4px;">Settings</div>
      <button class="admin-nav-item" onclick="showToast('Settings coming soon!','info')">
        <i class="fas fa-cog"></i> Settings
      </button>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">

      <!-- Dashboard Overview -->
      <div id="dashboardSection" class="admin-section">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 style="font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--text-dark);margin:0;">Overview</h4>
            <p style="color:var(--text-light);font-size:0.82rem;margin:0;">Last updated: <span id="lastUpdated"></span></p>
          </div>
          <button onclick="renderAdminStats();showToast('Stats refreshed','info')" style="background:var(--light-gray);border:none;padding:8px 16px;border-radius:99px;font-size:0.82rem;font-weight:600;cursor:pointer;color:var(--text-mid);transition:var(--transition);"
            onmouseover="this.style.background='var(--mid-gray)'" onmouseout="this.style.background='var(--light-gray)'">
            <i class="fas fa-sync-alt me-1"></i> Refresh
          </button>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-sm-6 col-xl-3">
            <div class="admin-stat-card">
              <div>
                <div class="admin-stat-num" id="totalProducts">—</div>
                <div class="admin-stat-label">Total Products</div>
              </div>
              <div class="admin-stat-icon" style="background:var(--primary-light);color:var(--primary);"><i class="fas fa-utensils"></i></div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="admin-stat-card">
              <div>
                <div class="admin-stat-num" id="totalOrders">—</div>
                <div class="admin-stat-label">Total Orders</div>
              </div>
              <div class="admin-stat-icon" style="background:rgba(17,138,178,0.12);color:var(--info);"><i class="fas fa-receipt"></i></div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="admin-stat-card">
              <div>
                <div class="admin-stat-num" id="totalUsers">—</div>
                <div class="admin-stat-label">Registered Users</div>
              </div>
              <div class="admin-stat-icon" style="background:rgba(6,214,160,0.12);color:var(--success);"><i class="fas fa-users"></i></div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="admin-stat-card">
              <div>
                <div class="admin-stat-num" id="totalRevenue">—</div>
                <div class="admin-stat-label">Total Revenue</div>
              </div>
              <div class="admin-stat-icon" style="background:rgba(249,199,79,0.15);color:#c48800;"><i class="fas fa-dollar-sign"></i></div>
            </div>
          </div>
        </div>

        <!-- Recent Orders Quick View -->
        <div style="background:white;border:1.5px solid var(--mid-gray);border-radius:var(--radius-xl);padding:24px;">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 style="font-weight:700;font-size:1rem;margin:0;">Recent Orders</h5>
            <button onclick="showAdminSection('orders')" style="background:none;border:none;color:var(--primary);font-size:0.82rem;font-weight:600;cursor:pointer;">View All →</button>
          </div>
          <div id="recentOrdersAdmin"></div>
        </div>
      </div>

      <!-- Products Section -->
      <div id="productsSection" class="admin-section" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
          <h4 style="font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--text-dark);margin:0;">Products</h4>
          <button class="btn-add-cart" data-bs-toggle="modal" data-bs-target="#productModal" onclick="resetProductForm()">
            <i class="fas fa-plus me-1"></i> Add Product
          </button>
        </div>
        <div style="background:white;border:1.5px solid var(--mid-gray);border-radius:var(--radius-xl);padding:20px;overflow-x:auto;">
          <div id="productsTable"></div>
        </div>
      </div>

      <!-- Orders Section -->
      <div id="ordersSection" class="admin-section" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 style="font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--text-dark);margin:0;">All Orders</h4>
        </div>
        <div style="background:white;border:1.5px solid var(--mid-gray);border-radius:var(--radius-xl);padding:20px;overflow-x:auto;">
          <div id="ordersTable"></div>
        </div>
      </div>

      <!-- Users Section -->
      <div id="usersSection" class="admin-section" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 style="font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--text-dark);margin:0;">Users</h4>
        </div>
        <div style="background:white;border:1.5px solid var(--mid-gray);border-radius:var(--radius-xl);padding:20px;overflow-x:auto;">
          <div id="usersTable"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="border-radius:var(--radius-xl);border:none;box-shadow:var(--shadow-xl);">
      <div class="modal-header" style="border-bottom:1.5px solid var(--mid-gray);padding:20px 24px;">
        <h5 class="modal-title" id="productModalTitle" style="font-weight:700;font-size:1rem;">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:24px;">
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Product Name *</label>
              <input type="text" class="form-input" id="productName" placeholder="e.g. Quinoa Buddha Bowl" required>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Price ($) *</label>
              <input type="number" step="0.01" min="0" class="form-input" id="productPrice" placeholder="12.99" required>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Category *</label>
              <select class="form-input" id="productCategory" required>
                <option value="Vegan">🥗 Vegan</option>
                <option value="High Protein">💪 High Protein</option>
                <option value="Keto">🥑 Keto</option>
                <option value="Healthy">❤️ Healthy</option>
                <option value="Low Calorie">🔥 Low Calorie</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Calories</label>
              <input type="number" class="form-input" id="productCalories" placeholder="380">
            </div>
            <div class="col-sm-6">
              <label class="form-label">Protein (g)</label>
              <input type="number" class="form-input" id="productProtein" placeholder="18">
            </div>
            <div class="col-12">
              <label class="form-label">Image URL</label>
              <input type="url" class="form-input" id="productImage" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-input" id="productDescription" rows="3" placeholder="Fresh, healthy ingredients..."></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top:1.5px solid var(--mid-gray);padding:16px 24px;gap:10px;">
        <button type="button" class="btn-admin-sm btn-edit" data-bs-dismiss="modal" style="padding:8px 18px;font-size:0.85rem;">Cancel</button>
        <button type="button" class="btn-add-cart" onclick="saveProduct()">
          <i class="fas fa-save me-1"></i> Save Product
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../services/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

    // Load recent orders into dashboard overview
    const orders = getAllOrders().reverse().slice(0, 5);
    const el = document.getElementById('recentOrdersAdmin');
    if (!orders.length) {
      el.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:20px 0;font-size:0.88rem;">No orders yet.</p>';
    } else {
      el.innerHTML = `<div style="overflow-x:auto;">
        <table class="admin-table">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
          <tbody>
            ${orders.map(o => `
              <tr>
                <td style="font-family:monospace;color:var(--primary);font-weight:600;font-size:0.82rem;">#${o.id.toUpperCase().slice(0,8)}</td>
                <td style="font-size:0.85rem;">${o.userName}</td>
                <td style="font-weight:700;">$${(o.total||0).toFixed(2)}</td>
                <td><span class="status-badge status-${o.status||'pending'}">${o.status||'pending'}</span></td>
                <td style="font-size:0.78rem;color:var(--text-light);">${new Date(o.createdAt).toLocaleDateString()}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    }
  });
</script>
</body>
</html>
