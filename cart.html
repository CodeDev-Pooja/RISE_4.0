<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart — SmartMeal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <div class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb" class="mb-2">
        <ol class="breadcrumb" style="font-size:0.8rem;">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active">Cart</li>
        </ol>
      </nav>
      <h1><i class="fas fa-shopping-basket me-3" style="opacity:0.8;font-size:1.6rem;"></i>My Cart</h1>
    </div>
  </div>

  <!-- Cart Section -->
  <div class="cart-container">
    <div class="container">
      <div class="row g-4">
        <!-- Cart Items -->
        <div class="col-lg-8">
          <div class="cart-card">
            <div class="cart-card-header">
              <h5><i class="fas fa-list me-2" style="color:var(--primary);"></i>Order Items</h5>
              <button onclick="clearCart()" style="background:none;border:none;color:var(--text-light);font-size:0.82rem;cursor:pointer;transition:var(--transition);"
                onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--text-light)'">
                <i class="fas fa-trash me-1"></i> Clear Cart
              </button>
            </div>
            <div id="cartItems">
              <div class="text-center py-4"><div class="spinner-ring" style="margin:0 auto;"></div></div>
            </div>
          </div>

          <!-- Continue Shopping -->
          <a href="menu.html" class="d-inline-flex align-items-center gap-2 mt-4" style="color:var(--text-mid);font-size:0.88rem;font-weight:500;transition:var(--transition);"
            onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-mid)'">
            <i class="fas fa-arrow-left"></i> Continue Shopping
          </a>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">
          <div class="order-summary-card">
            <h5 style="font-weight:700;font-size:1.05rem;color:var(--text-dark);margin-bottom:20px;padding-bottom:14px;border-bottom:1.5px solid var(--mid-gray);">
              <i class="fas fa-receipt me-2" style="color:var(--primary);"></i>Order Summary
            </h5>

            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotal">—</span>
            </div>
            <div class="summary-row">
              <span>Delivery</span>
              <span id="deliveryFee">—</span>
            </div>
            <div class="summary-row" id="discountSection" style="display:none;color:var(--success);">
              <span><i class="fas fa-tag me-1"></i>Discount</span>
              <span id="discountRow"></span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="total">—</span>
            </div>

            <!-- Promo Code -->
            <div style="margin:18px 0 16px;">
              <label style="font-size:0.78rem;font-weight:600;color:var(--text-mid);display:block;margin-bottom:8px;">
                <i class="fas fa-tag me-1"></i>Promo Code
              </label>
              <div class="promo-input-wrap">
                <input type="text" id="promoInput" class="promo-input" placeholder="SMART15, VEGAN10...">
                <button class="btn-apply-promo" onclick="applyPromoCode()">Apply</button>
              </div>
              <div style="font-size:0.73rem;color:var(--text-light);">Try: SMART15, VEGAN10, WELCOME20</div>
            </div>

            <!-- Delivery note -->
            <div style="background:rgba(6,214,160,0.1);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:0.8rem;color:var(--success);">
              <i class="fas fa-truck me-2"></i>
              <strong>Free delivery</strong> on orders above $25
            </div>

            <button id="checkoutBtn" class="btn-checkout">
              <i class="fas fa-lock me-2"></i> Secure Checkout
            </button>

            <div style="display:flex;justify-content:center;gap:16px;margin-top:14px;">
              <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/48px-Mastercard-logo.svg.png" height="20" alt="Mastercard" style="opacity:0.5;object-fit:contain;">
              <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/48px-Visa_Inc._logo.svg.png" height="20" alt="Visa" style="opacity:0.5;object-fit:contain;">
              <span style="font-size:0.72rem;color:var(--text-light);align-self:center;">PayPal • COD</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <button id="scrollTopBtn" title="Back to top"><i class="fas fa-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="services/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
